services:
  postgres:
    image: postgres:16-alpine
    container_name: helping_hands_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: helping_hands
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helping_hands_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: helping_hands_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/helping_hands?schema=public
      REDIS_HOST: redis
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    volumes:
      # Live source for hot reload (apps/api/Dockerfile `dev` stage runs
      # `nest start --watch`). The anonymous volumes below sit on top of the
      # bind mount so the container keeps its own installed node_modules /
      # generated Prisma client instead of the host's (likely absent or
      # stale) node_modules shadowing them.
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/database/node_modules
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: helping_hands_web
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:4000/api
    ports:
      - "3200:3200"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/database/node_modules

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    container_name: helping_hands_admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/database/node_modules

volumes:
  pgdata:
  uploads:
