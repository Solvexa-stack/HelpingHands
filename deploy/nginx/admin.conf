# Admin dashboard — reverse proxy to the "admin" container (docker-compose.prod.yml)
# Copy to /etc/nginx/sites-available/helpinghands-admin.conf on the VPS, then:
#   ln -s /etc/nginx/sites-available/helpinghands-admin.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d admin.yourdomain.com
# Replace admin.yourdomain.com below with your real subdomain first.

server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
