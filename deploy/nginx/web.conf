# Public website — reverse proxy to the "web" container (docker-compose.prod.yml)
# Copy to /etc/nginx/sites-available/helpinghands-web.conf on the VPS, then:
#   ln -s /etc/nginx/sites-available/helpinghands-web.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Replace yourdomain.com below with your real domain first.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
