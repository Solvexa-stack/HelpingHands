# API — reverse proxy to the "api" container (docker-compose.prod.yml)
# Copy to /etc/nginx/sites-available/helpinghands-api.conf on the VPS, then:
#   ln -s /etc/nginx/sites-available/helpinghands-api.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.yourdomain.com
# Replace api.yourdomain.com below with your real subdomain first.
# MAX_FILE_SIZE in .env is 10485760 bytes (~10MB); keep client_max_body_size above it.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
