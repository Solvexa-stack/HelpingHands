services:
  postgres:
    image: postgres:16-alpine
    container_name: helping_hands_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: helping_hands
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helping_hands_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${IMAGE_PREFIX}-api:latest
    container_name: helping_hands_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/helping_hands?schema=public
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    image: ${IMAGE_PREFIX}-web:latest
    container_name: helping_hands_web
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:4000/api
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      - api

  admin:
    image: ${IMAGE_PREFIX}-admin:latest
    container_name: helping_hands_admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
