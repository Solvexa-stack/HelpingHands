# W0-E1-S6 — Regression safety gate.
# This suite is the backward-compatibility contract for all roadmap waves
# (workspaceroadmap/backlog/BACKLOG_W0_FOUNDATIONS.md, Epic W0-E1).
# The job name `e2e-regression-suite` is referenced by branch protection on
# `main` — renaming it breaks the required check. See docs/10-ci.md.
name: API e2e tests

on:
  push:
    branches: [workspaceandcenterbox]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e-regression-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The harness owns this database: created, migrated and seeded per run.
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/helping_hands_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @helping-hands/database db:generate

      - name: Lint (ActorContext convention, W0-E2-S5)
        run: pnpm --filter @helping-hands/api lint

      - name: Run e2e regression suite
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e-output.log

      - name: Dump test database (failure only)
        if: failure()
        run: |
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U postgres --clean --if-exists helping_hands_test \
            > test-db-dump.sql || echo "test DB dump unavailable" > test-db-dump.sql

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            e2e-output.log
            test-db-dump.sql
