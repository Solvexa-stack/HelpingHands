name: Build and deploy

on:
  push:
    branches:
      - workspaceandcenterbox

  workflow_dispatch:


concurrency:
  group: deploy-production
  cancel-in-progress: false


env:
  IMAGE_PREFIX: ghcr.io/solvexa-stack/helpinghands


jobs:

  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    strategy:
      matrix:
        include:

          - app: api
            build_args: ""

          - app: web
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

          - app: admin
            build_args: |
              NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
              NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true

          build-args: ${{ matrix.build_args }}

          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}



  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest


    steps:

      - name: Deploy VPS

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}


          script: |

            set -e

            cd /var/www/HelpingHands


            echo "Pull latest images"

            docker compose -f docker-compose.prod.yml pull


            echo "Apply database migrations"

            docker compose -f docker-compose.prod.yml run --rm api \
            ./apps/api/node_modules/.bin/prisma migrate deploy \
            --schema packages/database/prisma/schema.prisma


            echo "Restart services"

            docker compose -f docker-compose.prod.yml up -d \
            --remove-orphans


            echo "Health check"

            sleep 15

            docker ps


            echo "Cleanup"

            docker image prune -f


            echo "Deployment completed"