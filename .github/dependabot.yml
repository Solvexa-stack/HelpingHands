version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      nextjs:
        patterns: ['next', 'react', 'react-dom']
      prisma:
        patterns: ['prisma', '@prisma/*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
