<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Voting Is Now Open</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">
  <div style="max-width:600px;margin:0 auto;background:#ffffff;">
    <div style="background:#7c3aed;padding:24px;text-align:center;">
      <h1 style="color:#ffffff;margin:0;font-size:24px;">HelpingHands</h1>
    </div>
    <div style="padding:32px;">
      <h2 style="color:#1f2937;margin-top:0;">Voting Is Now Open!</h2>
      <p style="color:#4b5563;line-height:1.6;">Dear <strong>{{participantName}}</strong>,</p>
      <p style="color:#4b5563;line-height:1.6;">
        Voting is now open for <strong>{{projectName}}</strong>.
        Make your voice heard — cast your vote before the deadline!
      </p>
      <div style="background:#f5f3ff;border-left:4px solid #7c3aed;padding:16px;margin:16px 0;border-radius:4px;">
        <p style="margin:0;color:#5b21b6;font-weight:bold;">Voting closes: {{votingEndsAt}}</p>
      </div>
      <a href="{{voteUrl}}"
         style="display:inline-block;background:#7c3aed;color:#ffffff;padding:12px 24px;border-radius:6px;text-decoration:none;margin-top:8px;font-weight:bold;">
        Cast Your Vote
      </a>
      <p style="color:#9ca3af;font-size:12px;margin-top:32px;">
        You are receiving this email as a registered participant on HelpingHands.
      </p>
    </div>
  </div>
</body>
</html>
